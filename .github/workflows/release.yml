name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release -p tc-app

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antares-threadclip-${{ matrix.os }}
          path: |
            target/release/tc-app
            target/release/tc-app.exe
